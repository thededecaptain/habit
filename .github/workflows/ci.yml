name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full run, so a regression from a dependency, Shopify, or the
  # clock (expiry, trials) shows up even on quiet days.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: habit

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: habit/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate webhook URIs
        run: npm run validate:webhooks

      - name: Typecheck (app and tests)
        run: npm run typecheck

      - name: Lint app code
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SHOPIFY_API_KEY: placeholder-for-ci-build
          SHOPIFY_API_SECRET: placeholder-for-ci-build
          SCOPES: read_orders,read_customers,write_customers,write_discounts
          SHOPIFY_APP_URL: https://example.com

      # Unit, database (real Postgres 17 via embedded-postgres, every
      # migration applied fresh), admin UI, storefront scripts, and checkout
      # and account extensions. Fails if coverage drops below the thresholds
      # in vitest.config.ts.
      - name: App tests with coverage
        run: npm run test:app

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: habit/coverage
          retention-days: 14

      - name: Shopify Function tests
        run: npm run test:functions
