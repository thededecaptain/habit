name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: habit
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NPM_CONFIG_ENGINE_STRICT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: habit/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run test --workspace=points-redemption -- --run src/discount.test.js
      - run: npm run typecheck
