# Learn more about configuring your customer account UI extension:
# https://shopify.dev/docs/api/customer-account-ui-extensions/latest/configuration

api_version = "2026-07"

[[extensions]]
name = "account-rewards"
handle = "account-rewards"
uid = "b19d469d-b6c1-f124-843e-505eac11069a2c72bae3"
type = "ui_extension"

# Exactly one target per customer-account page. Every target is offered
# separately in the accounts editor, so declaring several for the same page
# lets a merchant add "account-rewards" twice and get duplicate cards.
#
# Profile: the rewards card. PROFILE1 only applies on a fresh install;
# existing installs still need the block added in the editor.
[[extensions.targeting]]
module = "./src/Profile.jsx"
target = "customer-account.profile.block.render"
default_placement = "PROFILE1"

# Orders: a compact balance banner (root must be s-announcement).
[[extensions.targeting]]
module = "./src/Announcement.jsx"
target = "customer-account.order-index.announcement.render"

[extensions.capabilities]
# Needed to call the app backend for the signed-in customer's live balance.
network_access = true
