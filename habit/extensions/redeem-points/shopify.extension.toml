# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-07"

[[extensions]]
name = "redeem-points"
handle = "redeem-points"
type = "ui_extension"
uid = "34d6ac90-46a8-218d-e246-47cc8e5669e2508374e0"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

# One target per page: the editor lists every target separately, so declaring
# two for the same page lets a merchant add this extension twice.
#
# Checkout page (Shopify Plus only — Shopify restricts checkout-step extensions
# to Plus). Renders beside the discount code, where redeeming belongs. The
# merchant still activates it in the checkout editor first.
[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.reductions.render-after"

# Thank you page — available on every plan except Starter, so non-Plus stores
# still get a Habit surface in the purchase flow.
[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
# Needed to call our app's backend for the buyer's live points balance.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#network-access
network_access = true

# NOTE: reading `shopify.buyerIdentity.customer` (used below to identify the
# buyer) requires "Protected customer data" access, requested separately via
# Partner Dashboard > App setup > API access requests. Automatically granted
# for dev stores; required for public app review.

# Loads metafields on checkout resources, including the cart,
# products, customers, and more. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#metafields

[[extensions.metafields]]
namespace = "$app"
key = "points_to_redeem"

[[extensions.metafields]]
namespace = "$app"
key = "referral_code"
