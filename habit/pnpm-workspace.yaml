packages:
  - 'extensions/*'
allowBuilds:
  # Test-only Postgres (embedded-postgres): the install step sets up the
  # bundled binaries. One entry per platform tests run on.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  unrs-resolver: true
