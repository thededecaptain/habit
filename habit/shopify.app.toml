# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d4f4bcdc36a90b4443c2e6fde31bbd80"
name = "Habit"
application_url = "https://habit-production-9257.up.railway.app/app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [webhooks.privacy_compliance]
  customer_deletion_url = "https://habit-production-9257.up.railway.app/webhooks/customers/redact"
  customer_data_request_url = "https://habit-production-9257.up.railway.app/webhooks/customers/data_request"
  shop_deletion_url = "https://habit-production-9257.up.railway.app/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_customers,read_discounts,write_discounts"

[auth]
redirect_urls = [
  "https://habit-production-9257.up.railway.app/auth/callback",
]

[app_proxy]
url = "https://habit-production-9257.up.railway.app/proxy"
subpath = "habit"
prefix = "apps"

[shop.metafields.app.loyalty_settings]
type = "json"
name = "Loyalty settings"
description = "Earn and redemption rates for the Habit widget and checkout function."

[shop.metafields.app.loyalty_settings.access]
admin = "merchant_read"
storefront = "public_read"
